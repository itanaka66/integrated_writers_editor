name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: pip install ruff
      - run: cd apps/api && ruff check app
      - run: python -m compileall apps/api/app
      - run: cd apps/api && pytest -q
      - run: cd apps/api && DATABASE_URL=sqlite:///./_ci_migration_check.db alembic upgrade head && DATABASE_URL=sqlite:///./_ci_migration_check.db alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd apps/web && npm install
      - run: cd apps/web && npm run lint
      - run: cd apps/web && npm test
      - run: cd apps/web && npm run build
