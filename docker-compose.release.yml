## Distribution compose file used by the desktop installers (installer/windows,
## installer/macos) and anyone who'd rather pull prebuilt images than build
## locally. Unlike docker-compose.yml (which builds api/web from ./apps/*),
## this pulls published images from GHCR — the installers ship this file
## instead of the full source tree, so there's no local build step at all.
##
## Images are built and pushed by .github/workflows/docker-publish.yml on
## every version tag. Override the tag with IMAGE_TAG (defaults to "latest").
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-writers}
      POSTGRES_USER: ${POSTGRES_USER:-writers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-writers}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writers -d writers"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Optional — skip this service (scripts/setup.sh asks, or remove it and
  # run `docker compose up db qdrant api web`) to use an Ollama instance
  # already running on the host or another machine instead; point
  # OLLAMA_URL at it in that case. Uncomment the `deploy:` block below if
  # you have an NVIDIA GPU and the NVIDIA Container Toolkit installed —
  # without it, Ollama runs on CPU only (fine for small models, slow for
  # large ones).
  ollama:
    image: ollama/ollama:latest
    # Not started by a plain `docker compose up` (no profile active by
    # default) — Ollama runs on the host unless you opt in, matching the
    # documented default. `docker compose up ollama ...` (what
    # scripts/setup.sh does) or `--profile ollama` starts it anyway.
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    image: ghcr.io/${GHCR_OWNER:-itanaka66}/ine-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-writers}:${POSTGRES_PASSWORD:-writers}@db:5432/${POSTGRES_DB:-writers}}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env before running}
      writers_STORAGE_DIR: /writers_storage
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:-}
      GIT_AUTOSYNC_INTERVAL_SECONDS: ${GIT_AUTOSYNC_INTERVAL_SECONDS:-300}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
    volumes:
      - writers_storage:/writers_storage
      - backups:/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: ghcr.io/${GHCR_OWNER:-itanaka66}/ine-web:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  writers_storage:
  backups:
